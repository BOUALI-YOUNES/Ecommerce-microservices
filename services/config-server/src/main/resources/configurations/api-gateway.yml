server:
  port: 8080


spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # jwk-set-uri: http://keycloak:8080/realms/ecom-realm/protocol/openid-connect/certs
          issuer-uri: http://keycloak:8080/realms/ecom-realm
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/v1/products/**

            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/v1/customers/**

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payment/**

eureka:
  client:
    service-url:
          defaultZone: http://${EUREKA_HOST:discovery-server}:8761/eureka
management:
  endpoints:
    web:
      exposure:
        include: health