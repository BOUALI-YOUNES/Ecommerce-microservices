spring: 
    mongodb:
        username: ${MONGO_USER}
        password: ${MONGO_PASSWORD}
        port: 27017
        host: localhost
        database: customer
        authentication-database: admin
    kafka:
        bootstrap-servers: localhost:9092
        consumer:
            group-id: paymentGroup , orderGroup
            auto-offset-reset: earliest
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
            properties:
                "[spring.json.trusted.packages]": "*"
                "[spring.json.type.mapping]": "orderConfirmation:com.younes.notification.kafka.order.OrderConfirmation,paymentConfirmation:com.younes.notification.kafka.payment.PaymentConfirmation"
    mail:
        host: localhost
        port: 1025
        username: ${MAIL_USER}
        password: ${MAIL_PASSWORD}
        properties:
            mail:
                smtp:
                    trust: "*"
                auth: false
                starttls:
                    enable: false
                connectiontimeout: 5000
                timeout: 3000
                writetimeout: 5000
server:
    port: 8040