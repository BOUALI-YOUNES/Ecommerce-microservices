spring:
    datasource:
        url: jdbc:postgresql://localhost:5432/order
        username: ${POSTGRES_USER}
        password: ${POSTGRES_PASSWORD}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: create
        database: postgresql
        database-platform: org.hibernate.dialect.PostgreSQLDialect
    kafka:
        producer:
            bootstrap-servers: localhost:9092
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
            properties:
                spring.json.type.mapping: orderConfirmation:com.younes.order.kafka.OrderConfirmation
server:
    port: 8070
application:
    config:
        customer-url: http://localhost:8080/api/v1/customers
        product-url: http://localhost:8080/api/v1/products
        payment-url: http://localhost:8080/api/v1/payment 
