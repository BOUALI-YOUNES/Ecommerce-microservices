# Test-scope only. Production configuration comes from the config server.
#
# The generated contextLoads test runs on the host, where the config server is
# unreachable at its docker hostname. The config-server import is declared
# "optional:" so startup continues, which means these placeholders would
# otherwise be unresolved. No request is ever made to this URL: NimbusJwtDecoder
# only contacts the JWK set when it first has to validate a token.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:1/jwks
keycloak.issuer-uri=http://localhost:1/realms/test

# The JPA/Flyway autoconfiguration needs a DataSource even for a bare contextLoads
# test. H2 satisfies it; Flyway is off because the migrations are Postgres-specific
# and are exercised separately against a real Postgres.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false
