# Test-scope only. Production mail settings come from the config server, which is
# unreachable on the host, so JavaMailSender had no host to build from. MailDev is
# not contacted by this test.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# The Kafka listener container refuses to start without a group id, which is
# normally supplied by the config server.
spring.kafka.consumer.group-id=test-group
