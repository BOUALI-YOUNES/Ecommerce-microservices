services:
  config-server:
    build:
      context: ./config-server
      dockerfile: dockerfile
    container_name: "ms_config-server"
    networks:
      - ms-net
    ports:
      - 8888:8888
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/api-gateway/default"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  discovery-server:
    build:
      context: ./discovery
      dockerfile: dockerfile
    container_name: "discovery-server"
    networks:
      - ms-net
    ports:
      - 8761:8761
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/eureka/apps"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    

  postgres:
    container_name: ms_postgresql
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - postgres:/var/lib/postgresql/data
      # Creates the order/product/payment databases on first initialisation. This
      # script was previously never mounted, so the three JPA services failed on a
      # fresh volume and the databases had to be created by hand.
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - 5433:5432
    networks:
      - ms-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  pgadmin:
    container_name: ms_pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - 5000:80
    networks:
      - ms-net
    depends_on:
      - postgres
    restart: unless-stopped

  mongodb:
    container_name: ms_mongo
    image: mongo:7
    ports:
      - 27017:27017
    volumes:
      - mongodb:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    networks:
      - ms-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mongo-express:
    container_name: ms_mongo_express
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_USER}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_PASSWORD}
      - ME_CONFIG_MONGODB_SERVER=mongodb
    networks:
      - ms-net
    depends_on:
      - mongodb

  maildev:
    image: maildev/maildev
    container_name: ms_mail_dev
    ports:
      - 1080:1080
      - 1025:1025
    networks:
      - ms-net
    restart: unless-stopped

  zipkin:
    image: openzipkin/zipkin
    container_name: ms_zipkin
    ports:
      - "9411:9411"
    networks:
      - ms-net
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: ms_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - ms-net

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: ms_kafka
    ports:
      - 9092:9092
    depends_on: 
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - ms-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: dockerfile
    container_name: ms_api_gateway
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-f","http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ms-net
    restart: unless-stopped

  customer-service:
    build:
      context: ./customer
      dockerfile: dockerfile
    # Container memory limit: the JVM heap is a percentage of this (see dockerfile).
    mem_limit: 1g
    mem_reservation: 1g
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-f", "http://localhost:8090/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    environment:
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - DB_HOST=mongodb
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - ms-net
    restart: unless-stopped

  product-service:
    build:
      context: ./product
      dockerfile: dockerfile
    # Container memory limit: the JVM heap is a percentage of this (see dockerfile).
    mem_limit: 1g
    mem_reservation: 1g
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-f", "http://localhost:8050/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=postgres
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - ms-net
    restart: unless-stopped

  order-service:
    build:
      context: ./order
      dockerfile: dockerfile
    # Container memory limit: the JVM heap is a percentage of this (see dockerfile).
    mem_limit: 1g
    mem_reservation: 1g
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-f", "http://localhost:8070/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=postgres
      - KAFKA_BOOTSTRAP=kafka:29092
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ms-net
    restart: unless-stopped

  payment-service:
    build:
      context: ./payement
      dockerfile: dockerfile
    # Container memory limit: the JVM heap is a percentage of this (see dockerfile).
    mem_limit: 1g
    mem_reservation: 1g
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-f", "http://localhost:8055/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=postgres
      - KAFKA_BOOTSTRAP=kafka:29092
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ms-net
    restart: unless-stopped

  notification-service:
    build:
      context: ./notification
      dockerfile: dockerfile
    # Container memory limit: the JVM heap is a percentage of this (see dockerfile).
    mem_limit: 768m
    mem_reservation: 768m
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-f", "http://localhost:8040/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    environment:
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - DB_HOST=mongodb
      - KAFKA_BOOTSTRAP=kafka:29092
      - MAIL_HOST=maildev
      - MAIL_USER=
      - MAIL_PASSWORD=
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ms-net
    restart: unless-stopped
  
  keycloak:
    container_name: keycloak_ms
    image: quay.io/keycloak/keycloak:24.0.2
    ports:
      - 9098:8080
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    networks:
      - ms-net
    volumes:
      # Without this import the realm never exists, so every token request fails and
      # the resource servers reject all authenticated traffic.
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    command: 
      - "start-dev"
      - "--import-realm"

networks:
  ms-net:
    driver: bridge

volumes:
  postgres:
  pgadmin:
  mongodb:
