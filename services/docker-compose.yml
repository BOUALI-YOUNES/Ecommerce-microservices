services:
  config-server:
    # Heap, metaspace and code cache are pinned in the service dockerfile; keep
    # this limit above their sum to leave room for thread stacks and buffers.
    mem_limit: 448m
    mem_reservation: 256m
    build:
      context: ./config-server
      dockerfile: dockerfile
    container_name: "ms_config-server"
    networks:
      - ms-net
    ports:
      - 8888:8888
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/api-gateway/default"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  discovery-server:
    # Heap, metaspace and code cache are pinned in the service dockerfile; keep
    # this limit above their sum to leave room for thread stacks and buffers.
    mem_limit: 448m
    mem_reservation: 256m
    build:
      context: ./discovery
      dockerfile: dockerfile
    container_name: "discovery-server"
    networks:
      - ms-net
    ports:
      - 8761:8761
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/eureka/apps"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    

  postgres:
    # Cap so a single container cannot squeeze the others; sized from measured use.
    mem_limit: 256m
    mem_reservation: 128m
    container_name: ms_postgresql
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - postgres:/var/lib/postgresql/data
      # Creates the order/product/payment databases on first initialisation. This
      # script was previously never mounted, so the three JPA services failed on a
      # fresh volume and the databases had to be created by hand.
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - 5433:5432
    networks:
      - ms-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  pgadmin:
    # Cap so a single container cannot squeeze the others; sized from measured use.
    mem_limit: 384m
    mem_reservation: 192m
    container_name: ms_pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - 5000:80
    networks:
      - ms-net
    depends_on:
      - postgres
    restart: unless-stopped

  mongodb:
    # Cap so a single container cannot squeeze the others; sized from measured use.
    mem_limit: 384m
    mem_reservation: 192m
    container_name: ms_mongo
    image: mongo:7
    ports:
      - 27017:27017
    volumes:
      - mongodb:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    networks:
      - ms-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mongo-express:
    # Cap so a single container cannot squeeze the others; sized from measured use.
    mem_limit: 128m
    mem_reservation: 64m
    container_name: ms_mongo_express
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_USER}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_PASSWORD}
      - ME_CONFIG_MONGODB_SERVER=mongodb
    networks:
      - ms-net
    depends_on:
      - mongodb

  maildev:
    # Cap so a single container cannot squeeze the others; sized from measured use.
    mem_limit: 160m
    mem_reservation: 80m
    image: maildev/maildev
    container_name: ms_mail_dev
    ports:
      - 1080:1080
      - 1025:1025
    networks:
      - ms-net
    restart: unless-stopped

  zipkin:
    # Cap so a single container cannot squeeze the others; sized from measured use.
    mem_limit: 384m
    mem_reservation: 192m
    image: openzipkin/zipkin
    container_name: ms_zipkin
    ports:
      - "9411:9411"
    networks:
      - ms-net
  
  zookeeper:
    # Cap so a single container cannot squeeze the others; sized from measured use.
    mem_limit: 256m
    mem_reservation: 128m
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: ms_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - ms-net

  kafka:
    # Cap so a single container cannot squeeze the others; sized from measured use.
    mem_limit: 640m
    mem_reservation: 320m
    image: confluentinc/cp-kafka:7.7.1
    container_name: ms_kafka
    ports:
      - 9092:9092
    depends_on: 
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - ms-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  api-gateway:
    # Heap, metaspace and code cache are pinned in the service dockerfile; keep
    # this limit above their sum to leave room for thread stacks and buffers.
    mem_limit: 512m
    mem_reservation: 288m
    build:
      context: ./api-gateway
      dockerfile: dockerfile
    container_name: ms_api_gateway
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-f","http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ms-net
    restart: unless-stopped

  customer-service:
    # Heap, metaspace and code cache are pinned in the service dockerfile; keep
    # this limit above their sum to leave room for thread stacks and buffers.
    mem_limit: 640m
    mem_reservation: 384m
    build:
      context: ./customer
      dockerfile: dockerfile
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-f", "http://localhost:8090/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    environment:
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - DB_HOST=mongodb
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - ms-net
    restart: unless-stopped

  product-service:
    # Heap, metaspace and code cache are pinned in the service dockerfile; keep
    # this limit above their sum to leave room for thread stacks and buffers.
    mem_limit: 704m
    mem_reservation: 448m
    build:
      context: ./product
      dockerfile: dockerfile
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-f", "http://localhost:8050/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=postgres
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - ms-net
    restart: unless-stopped

  order-service:
    # Heap, metaspace and code cache are pinned in the service dockerfile; keep
    # this limit above their sum to leave room for thread stacks and buffers.
    mem_limit: 768m
    mem_reservation: 512m
    build:
      context: ./order
      dockerfile: dockerfile
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-f", "http://localhost:8070/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=postgres
      - KAFKA_BOOTSTRAP=kafka:29092
      # Used only for the internal stock-release callback, which the product service
      # restricts to this service account instead of accepting any user token.
      - ORDER_SERVICE_CLIENT_ID=${ORDER_SERVICE_CLIENT_ID}
      - ORDER_SERVICE_CLIENT_SECRET=${ORDER_SERVICE_CLIENT_SECRET}
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ms-net
    restart: unless-stopped

  payment-service:
    # Heap, metaspace and code cache are pinned in the service dockerfile; keep
    # this limit above their sum to leave room for thread stacks and buffers.
    mem_limit: 704m
    mem_reservation: 448m
    build:
      context: ./payement
      dockerfile: dockerfile
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-f", "http://localhost:8055/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=postgres
      - KAFKA_BOOTSTRAP=kafka:29092
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ms-net
    restart: unless-stopped

  notification-service:
    # Heap, metaspace and code cache are pinned in the service dockerfile; keep
    # this limit above their sum to leave room for thread stacks and buffers.
    mem_limit: 576m
    mem_reservation: 320m
    build:
      context: ./notification
      dockerfile: dockerfile
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-f", "http://localhost:8040/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    environment:
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - DB_HOST=mongodb
      - KAFKA_BOOTSTRAP=kafka:29092
      - MAIL_HOST=maildev
      - MAIL_USER=
      - MAIL_PASSWORD=
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ms-net
    restart: unless-stopped
  
  keycloak:
    # Heap is pinned by JAVA_OPTS below; keep this limit above heap plus
    # metaspace so the JVM still has room for thread stacks and buffers.
    mem_limit: 768m
    mem_reservation: 448m
    container_name: keycloak_ms
    image: quay.io/keycloak/keycloak:24.0.2
    ports:
      - 9098:8080
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      # Keycloak has no dockerfile of ours, so its heap is bounded here instead.
      # Left alone it sizes itself against the whole Docker VM, and start-dev is the
      # heaviest single process in the stack.
      - JAVA_OPTS=-Xms64m -Xmx320m -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError
      # Pins the hostname Keycloak puts in the iss claim, so a token is identical
      # whether it was minted from the host (localhost:9098) or from another container
      # (keycloak:8080). Without this the service-to-service token was issued with
      # iss=http://keycloak:8080/... and every resource server, which validates the
      # external issuer, answered 401.
      - KC_HOSTNAME=localhost
      - KC_HOSTNAME_PORT=9098
    networks:
      - ms-net
    volumes:
      # Without this import the realm never exists, so every token request fails and
      # the resource servers reject all authenticated traffic.
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      # Without a volume here Keycloak starts with an empty database on every boot,
      # re-imports the realm and mints new internal user ids. Customer profiles are
      # keyed by that id, so every stack restart silently orphaned them and orders
      # then failed with "no customer profile is associated with the authenticated
      # user". Mounted on the h2 directory so the import file above stays visible.
      - keycloak-db:/opt/keycloak/data/h2
    # The h2 volume is created root-owned, and Keycloak's uid 1000 then cannot write
    # its lock file ("Could not save properties .../keycloakdb.lock.db"). Running as
    # root is acceptable for this dev-only stack and avoids a manual chown step that
    # everybody would forget; a real deployment should use a properly owned image or
    # point KC_DB at a database server.
    user: root
    # Pins the hostname Keycloak puts in the iss claim, so a token is identical whether
    # it was minted from the host (localhost:9098) or from another container
    # (keycloak:8080). Without this the service-to-service token was issued with
    # iss=http://keycloak:8080/... and every resource server, which validates the
    # external issuer, answered 401.
    command: 
      - "start-dev"
      - "--import-realm"

networks:
  ms-net:
    driver: bridge

volumes:
  postgres:
  pgadmin:
  mongodb:
  keycloak-db:
